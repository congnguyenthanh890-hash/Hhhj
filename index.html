<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groq AI Chat - Org Mode</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #00ff00;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: #111;
    border-bottom: 2px solid #00ff00;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .header h1 {
    color: #ff0000;
    font-size: 16px;
    text-shadow: 0 0 10px #ff0000;
  }
  .header .status { font-size: 11px; color: #00ff00; }
  .header .status.offline { color: #ff0000; }
  .org-badge {
    background: #330033;
    border: 1px solid #ff00ff;
    color: #ff00ff;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 10px;
    margin-left: 10px;
  }
  .controls {
    background: #111;
    border-bottom: 1px solid #333;
    padding: 8px 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .controls select {
    background: #000;
    border: 1px solid #00ff00;
    color: #00ff00;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 4px;
    outline: none;
  }
  .controls button {
    background: #0055aa;
    color: #fff;
    border: none;
    padding: 5px 12px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    cursor: pointer;
  }
  .controls button:hover { background: #0088ff; }
  .controls button.danger { background: #aa0000; }
  .controls button.danger:hover { background: #ff0000; }
  .controls button.org { background: #6600aa; }
  .controls button.org:hover { background: #9900ff; }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    word-wrap: break-word;
    white-space: pre-wrap;
    animation: fadeIn 0.3s;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: #003300;
    border: 1px solid #00ff00;
    color: #00ff00;
  }
  .msg.ai {
    align-self: flex-start;
    background: #001133;
    border: 1px solid #0088ff;
    color: #88ccff;
  }
  .msg.system {
    align-self: center;
    background: #222;
    border: 1px solid #666;
    color: #aaa;
    font-size: 11px;
    max-width: 90%;
  }
  .msg.error {
    align-self: center;
    background: #330000;
    border: 1px solid #ff0000;
    color: #ff6666;
    font-size: 11px;
  }
  .input-area {
    background: #111;
    border-top: 2px solid #00ff00;
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .input-area textarea {
    flex: 1;
    background: #000;
    border: 1px solid #00ff00;
    color: #00ff00;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    padding: 10px;
    border-radius: 4px;
    resize: none;
    outline: none;
    height: 60px;
  }
  .input-area textarea:focus { box-shadow: 0 0 10px #00ff00; }
  .input-area button {
    background: #00aa00;
    color: #fff;
    border: none;
    padding: 0 25px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
  }
  .input-area button:hover { background: #00ff00; color: #000; }
  .input-area button:disabled {
    background: #333;
    color: #666;
    cursor: not-allowed;
  }
  .typing { display: inline-block; color: #0088ff; }
  .typing::after { content: '...'; animation: dots 1.5s infinite; }
  @keyframes dots {
    0%, 20% { content: '.'; }
    40% { content: '..'; }
    60%, 100% { content: '...'; }
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #111; }
  ::-webkit-scrollbar-thumb { background: #00ff00; border-radius: 4px; }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ GROQ AI CHAT ⚡ <span class="org-badge">ORG MODE</span></h1>
  <div class="status" id="status">● ĐANG KIỂM TRA...</div>
</div>

<div class="controls">
  <label style="color:#ffff00;font-size:11px;">Model:</label>
  <select id="modelSelect">
    <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
    <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
    <option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
    <option value="openai/gpt-oss-20b">GPT-OSS 20B</option>
    <option value="meta-llama/llama-4-scout-17b-16e-instruct">Llama 4 Scout 17B</option>
    <option value="meta-llama/llama-4-maverick-17b-128e-instruct">Llama 4 Maverick 17B</option>
    <option value="qwen/qwen3-32b">Qwen3 32B</option>
    <option value="deepseek-r1-distill-llama-70b">DeepSeek R1 70B</option>
    <option value="gemma2-9b-it">Gemma2 9B</option>
    <option value="mixtral-8x7b-32768">Mixtral 8x7B</option>
  </select>
  <button id="btnClear" class="danger">🗑 XÓA CHAT</button>
  <button id="btnSystem">📝 SYSTEM PROMPT</button>
  <button id="btnOrg" class="org">🏢 ORG INFO</button>
  <span style="color:#888;font-size:10px;margin-left:auto;" id="msgCount">0 tin nhắn</span>
</div>

<div class="chat" id="chat"></div>

<div class="input-area">
  <textarea id="input" placeholder="Nhập tin nhắn... (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
  <button id="btnSend">GỬI ➤</button>
</div>

<script>
// Bypass By nhatanh Dev - Groq AI Chat
// API Key: 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
// Org ID: org_01m4gqb6hee6xbend1g766az2z

const API_KEY = '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';
const ORG_ID = 'org_01m4gqb6hee6xbend1g766az2z';
const API_URL = 'https://api.groq.com/openai/v1/chat/completions';
const ORG_API_URL = 'https://api.groq.com/openai/v1/organizations/' + ORG_ID;

const chatBox = document.getElementById('chat');
const input = document.getElementById('input');
const btnSend = document.getElementById('btnSend');
const btnClear = document.getElementById('btnClear');
const btnSystem = document.getElementById('btnSystem');
const btnOrg = document.getElementById('btnOrg');
const modelSelect = document.getElementById('modelSelect');
const statusEl = document.getElementById('status');
const msgCount = document.getElementById('msgCount');

let conversation = [
  { role: 'system', content: 'Bạn là trợ lý AI thông minh, trả lời bằng tiếng Việt, ngắn gọn và chính xác.' }
];
let isLoading = false;

function updateMsgCount() {
  msgCount.textContent = (conversation.length - 1) + ' tin nhắn';
}

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : role === 'assistant' ? 'ai' : role);
  div.textContent = content;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = '<span class="typing">Đang trả lời</span>';
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

// Headers có kèm Org ID
function getHeaders() {
  return {
    'Authorization': 'Bearer ' + API_KEY,
    'Content-Type': 'application/json',
    'OpenAI-Organization': ORG_ID
  };
}

// Gửi tin nhắn lên Groq API
async function sendToGroq(messages, model) {
  const response = await fetch(API_URL, {
    method: 'POST',
    headers: getHeaders(),
    body: JSON.stringify({
      model: model,
      messages: messages,
      temperature: 0.7,
      max_tokens: 2048,
      stream: false
    })
  });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error('HTTP ' + response.status + ': ' + errText);
  }

  const data = await response.json();
  return data.choices[0].message.content;
}

// Lấy thông tin org
async function fetchOrgInfo() {
  try {
    const res = await fetch(ORG_API_URL, { headers: getHeaders() });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    return { error: e.message };
  }
}

// Gửi tin nhắn
async function sendMessage() {
  const text = input.value.trim();
  if (!text || isLoading) return;

  addMessage('user', text);
  conversation.push({ role: 'user', content: text });
  updateMsgCount();

  input.value = '';
  input.style.height = '60px';
  isLoading = true;
  btnSend.disabled = true;

  const typingEl = addTyping();
  const model = modelSelect.value;

  try {
    const reply = await sendToGroq(conversation, model);
    typingEl.remove();
    addMessage('assistant', reply);
    conversation.push({ role: 'assistant', content: reply });
    updateMsgCount();
  } catch (err) {
    typingEl.remove();
    addMessage('error', '❌ Lỗi: ' + err.message);
    statusEl.textContent = '● ERROR';
    statusEl.classList.add('offline');
    setTimeout(() => {
      statusEl.textContent = '● ONLINE';
      statusEl.classList.remove('offline');
    }, 3000);
  }

  isLoading = false;
  btnSend.disabled = false;
  input.focus();
}

// Xóa chat
function clearChat() {
  chatBox.innerHTML = '';
  conversation = [
    { role: 'system', content: 'Bạn là trợ lý AI thông minh, trả lời bằng tiếng Việt, ngắn gọn và chính xác.' }
  ];
  updateMsgCount();
  addMessage('system', 'Đã xóa cuộc trò chuyện');
  setTimeout(() => { chatBox.innerHTML = ''; }, 1000);
}

// Đổi system prompt
function changeSystem() {
  const current = conversation[0].content;
  const newPrompt = prompt('Nhập System Prompt mới:', current);
  if (newPrompt !== null && newPrompt.trim()) {
    conversation[0].content = newPrompt.trim();
    addMessage('system', 'Đã cập nhật System Prompt');
  }
}

// Hiển thị thông tin org
async function showOrgInfo() {
  addMessage('system', '🏢 Đang lấy thông tin organization...');
  const info = await fetchOrgInfo();
  if (info.error) {
    addMessage('error', '❌ Không lấy được org info: ' + info.error);
  } else {
    addMessage('system',
      '🏢 ORG INFO\n' +
      'Org ID: ' + ORG_ID + '\n' +
      'Name: ' + (info.name || 'N/A') + '\n' +
      'Status: ' + (info.status || 'active')
    );
  }
}

// Sự kiện
btnSend.addEventListener('click', sendMessage);
btnClear.addEventListener('click', clearChat);
btnSystem.addEventListener('click', changeSystem);
btnOrg.addEventListener('click', showOrgInfo);

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
});

// Khởi tạo
addMessage('system', '⚡ Groq AI Chat (ORG MODE) đã sẵn sàng.');
addMessage('system', 'Org: ' + ORG_ID);
updateMsgCount();
input.focus();

// Test kết nối API + Org
fetch('https://api.groq.com/openai/v1/models', {
  headers: getHeaders()
}).then(r => {
  if (r.ok) {
    statusEl.textContent = '● ONLINE';
    statusEl.classList.remove('offline');
    addMessage('system', '✅ Kết nối Groq API thành công (Org verified)');
  } else {
    statusEl.textContent = '● OFFLINE';
    statusEl.classList.add('offline');
    addMessage('error', '❌ API key hoặc Org ID không hợp lệ');
  }
}).catch(e => {
  statusEl.textContent = '● OFFLINE';
  statusEl.classList.add('offline');
  addMessage('error', '❌ Không kết nối được API: ' + e.message);
});
</script>
</body>
</html>
