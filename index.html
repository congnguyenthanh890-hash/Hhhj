<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groq AI Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #00ff00;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: #111;
    border-bottom: 2px solid #00ff00;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .header h1 {
    color: #ff0000;
    font-size: 16px;
    text-shadow: 0 0 10px #ff0000;
  }
  .header .status { font-size: 11px; color: #00ff00; }
  .header .status.offline { color: #ff0000; }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    word-wrap: break-word;
    white-space: pre-wrap;
    animation: fadeIn 0.3s;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: #003300;
    border: 1px solid #00ff00;
    color: #00ff00;
  }
  .msg.ai {
    align-self: flex-start;
    background: #001133;
    border: 1px solid #0088ff;
    color: #88ccff;
  }
  .msg.system {
    align-self: center;
    background: #222;
    border: 1px solid #666;
    color: #aaa;
    font-size: 11px;
    max-width: 90%;
  }
  .msg.error {
    align-self: center;
    background: #330000;
    border: 1px solid #ff0000;
    color: #ff6666;
    font-size: 11px;
  }
  .input-area {
    background: #111;
    border-top: 2px solid #00ff00;
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .input-area textarea {
    flex: 1;
    background: #000;
    border: 1px solid #00ff00;
    color: #00ff00;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    padding: 10px;
    border-radius: 4px;
    resize: none;
    outline: none;
    height: 60px;
  }
  .input-area textarea:focus { box-shadow: 0 0 10px #00ff00; }
  .input-area button {
    background: #00aa00;
    color: #fff;
    border: none;
    padding: 0 25px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
  }
  .input-area button:hover { background: #00ff00; color: #000; }
  .input-area button:disabled {
    background: #333;
    color: #666;
    cursor: not-allowed;
  }
  .typing { display: inline-block; color: #0088ff; }
  .typing::after { content: '...'; animation: dots 1.5s infinite; }
  @keyframes dots {
    0%, 20% { content: '.'; }
    40% { content: '..'; }
    60%, 100% { content: '...'; }
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #111; }
  ::-webkit-scrollbar-thumb { background: #00ff00; border-radius: 4px; }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ GROQ AI CHAT ⚡</h1>
  <div class="status" id="status">● ĐANG KIỂM TRA...</div>
</div>

<div class="chat" id="chat"></div>

<div class="input-area">
  <textarea id="input" placeholder="Nhập tin nhắn... (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
  <button id="btnSend">GỬI ➤</button>
</div>

<script>
// Bypass By nhatanh Dev - Groq AI Chat
// API Key: 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
// Org ID: org_01m4gqb6hee6xbend1g766az2z
// Model cố định: openai/gpt-oss-120b

const API_KEY = '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';
const ORG_ID = 'org_01m4gqb6hee6xbend1g766az2z';
const MODEL = 'openai/gpt-oss-120b';
const API_URL = 'https://api.groq.com/openai/v1/chat/completions';

const chatBox = document.getElementById('chat');
const input = document.getElementById('input');
const btnSend = document.getElementById('btnSend');
const statusEl = document.getElementById('status');

let conversation = [
  { role: 'system', content: 'Bạn là trợ lý AI thông minh, trả lời bằng tiếng Việt, ngắn gọn và chính xác.' }
];
let isLoading = false;

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : role === 'assistant' ? 'ai' : role);
  div.textContent = content;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = '<span class="typing">Đang trả lời</span>';
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function getHeaders() {
  return {
    'Authorization': 'Bearer ' + API_KEY,
    'Content-Type': 'application/json',
    'OpenAI-Organization': ORG_ID
  };
}

async function sendToGroq(messages) {
  const response = await fetch(API_URL, {
    method: 'POST',
    headers: getHeaders(),
    body: JSON.stringify({
      model: MODEL,
      messages: messages,
      temperature: 0.7,
      max_tokens: 2048,
      stream: false
    })
  });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error('HTTP ' + response.status + ': ' + errText);
  }

  const data = await response.json();
  return data.choices[0].message.content;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || isLoading) return;

  addMessage('user', text);
  conversation.push({ role: 'user', content: text });

  input.value = '';
  input.style.height = '60px';
  isLoading = true;
  btnSend.disabled = true;

  const typingEl = addTyping();

  try {
    const reply = await sendToGroq(conversation);
    typingEl.remove();
    addMessage('assistant', reply);
    conversation.push({ role: 'assistant', content: reply });
  } catch (err) {
    typingEl.remove();
    addMessage('error', '❌ Lỗi: ' + err.message);
    statusEl.textContent = '● ERROR';
    statusEl.classList.add('offline');
    setTimeout(() => {
      statusEl.textContent = '● ONLINE';
      statusEl.classList.remove('offline');
    }, 3000);
  }

  isLoading = false;
  btnSend.disabled = false;
  input.focus();
}

btnSend.addEventListener('click', sendMessage);

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
});

input.focus();

// Test kết nối
fetch('https://api.groq.com/openai/v1/models', {
  headers: getHeaders()
}).then(r => {
  if (r.ok) {
    statusEl.textContent = '● ONLINE';
    statusEl.classList.remove('offline');
    addMessage('system', '✅ Kết nối thành công - Model: ' + MODEL);
  } else {
    statusEl.textContent = '● OFFLINE';
    statusEl.classList.add('offline');
    addMessage('error', '❌ API key hoặc Org ID không hợp lệ');
  }
}).catch(e => {
  statusEl.textContent = '● OFFLINE';
  statusEl.classList.add('offline');
  addMessage('error', '❌ Không kết nối được API: ' + e.message);
});
</script>
</body>
</html>
